<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>تفاصيل القافلة الخيرية - مركز يثرب الخيري التخصصي</title>
    
    <!-- ===== الأمن السيبراني الشامل ===== -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self' https: data: blob:;
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com https://cdnjs.cloudflare.com https://fonts.googleapis.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com;
        font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:;
        img-src 'self' data: https: blob:;
        connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com;
    ">
    
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="format-detection" content="telephone=no">
    
    <!-- ===== Fonts & Icons ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- ===== Firebase SDK ===== -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #0e7c9e;
            --primary-dark: #0a5d7a;
            --primary-light: #2a9bc2;
            --secondary: #fbbf24;
            --secondary-dark: #f59e0b;
            --accent: #10b981;
            --danger: #ef4444;
            --light: #f8fafc;
            --dark: #0a1f2f;
            --darker: #051118;
            --gray: #94a3b8;
            --gradient-primary: linear-gradient(145deg, #0e7c9e, #0a5d7a);
            --gradient-secondary: linear-gradient(145deg, #fbbf24, #f59e0b);
            --shadow-sm: 0 4px 6px rgba(0,0,0,0.1);
            --shadow-md: 0 10px 30px rgba(0,0,0,0.3);
            --shadow-lg: 0 20px 50px rgba(0,0,0,0.5);
            --shadow-xl: 0 30px 70px rgba(0,0,0,0.7);
            --shadow-glow: 0 0 30px rgba(251,191,36,0.3);
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(145deg, var(--darker), var(--dark));
            color: var(--light);
            min-height: 100vh;
        }

        /* ===== حماية ===== */
        body {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        img { pointer-events: none; -webkit-user-drag: none; user-drag: none; }

        /* ===== الشريط العلوي ===== */
        .top-bar {
            background: rgba(5,17,24,0.8);
            backdrop-filter: blur(20px);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(251,191,36,0.2);
            flex-wrap: wrap;
            gap: 15px;
        }
        .logo-area { display: flex; align-items: center; gap: 15px; }
        .logo { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
        .site-title { font-size: 1.3rem; font-weight: 700; color: white; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { color: var(--gray); text-decoration: none; transition: all 0.3s; }
        .nav-links a:hover { color: var(--secondary); }

        /* ===== شاشة التحميل ===== */
        .loading {
            text-align: center;
            padding: 100px 20px;
        }
        .loading i { font-size: 3rem; color: var(--secondary); animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== المحتوى ===== */
        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }

        /* ===== بطاقة القافلة ===== */
        .caravan-card {
            background: rgba(5,17,24,0.6);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            overflow: hidden;
            border: 1px solid rgba(251,191,36,0.1);
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .caravan-header {
            background: linear-gradient(145deg, var(--primary), var(--primary-dark));
            padding: 40px;
            text-align: center;
            position: relative;
        }
        .caravan-name {
            font-size: 2.5rem;
            font-weight: 900;
            color: white;
            margin-bottom: 15px;
        }
        .caravan-dates {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            color: rgba(255,255,255,0.8);
        }
        .caravan-dates span { display: flex; align-items: center; gap: 8px; }
        .caravan-status {
            display: inline-block;
            padding: 8px 25px;
            border-radius: 40px;
            margin-top: 20px;
            font-weight: 600;
        }
        .status-active { background: rgba(16,185,129,0.3); color: var(--accent); border: 1px solid var(--accent); }
        .status-upcoming { background: rgba(251,191,36,0.3); color: var(--secondary); border: 1px solid var(--secondary); }
        .status-ended { background: rgba(239,68,68,0.3); color: var(--danger); border: 1px solid var(--danger); }

        /* ===== الصورة ===== */
        .caravan-image-section {
            padding: 30px;
            text-align: center;
            border-bottom: 1px solid rgba(251,191,36,0.1);
        }
        .caravan-image {
            max-width: 100%;
            max-height: 400px;
            border-radius: 30px;
            box-shadow: var(--shadow-lg);
            border: 2px solid var(--secondary);
        }

        /* ===== الوصف ===== */
        .description-section {
            padding: 30px;
            border-bottom: 1px solid rgba(251,191,36,0.1);
        }
        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--secondary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .description-text {
            color: var(--light);
            font-size: 1.1rem;
            line-height: 1.8;
        }

        /* ===== الخدمات ===== */
        .services-section {
            padding: 30px;
            border-bottom: 1px solid rgba(251,191,36,0.1);
        }
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .service-card {
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            padding: 20px;
            transition: all 0.3s;
        }
        .service-card:hover { transform: translateY(-5px); border: 1px solid var(--secondary); }
        .service-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: white;
            margin-bottom: 10px;
        }
        .service-discount {
            color: var(--accent);
            font-size: 1.5rem;
            font-weight: 700;
        }
        .service-original {
            text-decoration: line-through;
            color: var(--danger);
            font-size: 0.9rem;
            margin-right: 10px;
        }
        .free-service {
            color: var(--secondary);
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        /* ===== زر العودة ===== */
        .back-section {
            padding: 30px;
            text-align: center;
        }
        .back-btn {
            background: var(--gradient-primary);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 60px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }
        .back-btn:hover { transform: translateY(-3px); box-shadow: var(--shadow-glow); }

        /* ===== الفوتر ===== */
        .footer {
            background: rgba(5,17,24,0.8);
            padding: 40px 20px;
            text-align: center;
            margin-top: 60px;
            border-top: 1px solid rgba(251,191,36,0.1);
            color: var(--gray);
        }
        .footer a { color: var(--secondary); text-decoration: none; margin: 0 10px; }

        /* ===== رسائل ===== */
        .message {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 15px;
            color: white;
            z-index: 10001;
            animation: slideIn 0.3s ease;
            display: none;
        }
        .message.success { background: var(--gradient-primary); }
        .message.error { background: linear-gradient(145deg, #ef4444, #dc2626); }
        @keyframes slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @media (max-width: 768px) {
            .top-bar { flex-direction: column; text-align: center; }
            .caravan-name { font-size: 1.8rem; }
            .services-grid { grid-template-columns: 1fr; }
            .section-title { font-size: 1.3rem; }
            .caravan-dates { flex-direction: column; align-items: center; gap: 10px; }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="logo-area">
            <img src="" alt="Logo" class="logo" id="siteLogo">
            <span class="site-title" id="siteTitle">مركز يثرب</span>
        </div>
        <div class="nav-links">
            <a href="/index.html">الرئيسية</a>
            <a href="/clinic/index.html">العيادات</a>
            <a href="/lab/index.html">المعمل</a>
            <a href="/admin/login.html">دخول الأدمن</a>
        </div>
    </div>

    <div class="container" id="container">
        <div class="loading" id="loading">
            <i class="fas fa-circle-notch"></i>
            <p>جاري تحميل بيانات القافلة...</p>
        </div>
        <div id="caravanContent" style="display: none;"></div>
    </div>

    <div class="footer">
        <a href="/index.html">الرئيسية</a>
        <a href="/clinic/index.html">العيادات</a>
        <a href="/lab/index.html">المعمل</a>
        <a href="/admin/login.html">دخول الأدمن</a>
        <p style="margin-top: 15px;">نقابة تكنولوجيا المعلومات والبرمجيات المصرية © 2026</p>
    </div>

    <div id="message" class="message"></div>

    <script>
        // ============================================
        // الأمن السيبراني الشامل
        // ============================================
        (function() {
            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('keydown', e => {
                if (e.ctrlKey && ['c','x','u','s','p','a','v'].includes(e.key.toLowerCase())) e.preventDefault();
                if (e.key === 'F12' || e.keyCode === 123) e.preventDefault();
                if (e.key === 'PrintScreen' || e.keyCode === 44) e.preventDefault();
            });
            document.addEventListener('selectstart', e => e.preventDefault());
            document.addEventListener('dragstart', e => e.preventDefault());
            document.addEventListener('copy', e => e.preventDefault());
            document.addEventListener('cut', e => e.preventDefault());
        })();

        // ============================================
        // تهيئة Firebase
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyDMXfjOsas18yb0b8mbbhGqJj78yFFTVyU",
            authDomain: "yathreb-10909.firebaseapp.com",
            projectId: "yathreb-10909"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ============================================
        // متغيرات عامة
        // ============================================
        let caravanId = null;
        let caravanData = null;

        // ============================================
        // الحصول على ID القافلة من الرابط
        // ============================================
        function getCaravanIdFromUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id');
        }

        // ============================================
        // تحميل بيانات الموقع العامة
        // ============================================
        async function loadSiteData() {
            try {
                const settings = await db.collection('settings').doc('comingSoon').get();
                if (settings.exists) {
                    const data = settings.data();
                    if (data.logoUrl) document.getElementById('siteLogo').src = data.logoUrl;
                    if (data.centerName) document.getElementById('siteTitle').textContent = data.centerName;
                }
            } catch (error) {
                console.log('Error loading site data:', error);
            }
        }

        // ============================================
        // حساب حالة القافلة
        // ============================================
        function getCaravanStatus(startDate, endDate) {
            const today = new Date().toISOString().split('T')[0];
            if (startDate <= today && endDate >= today) return 'active';
            if (startDate > today) return 'upcoming';
            return 'ended';
        }

        // ============================================
        // تحميل بيانات القافلة
        // ============================================
        async function loadCaravanData() {
            caravanId = getCaravanIdFromUrl();
            
            if (!caravanId) {
                showMessage('❌ لم يتم تحديد القافلة', 'error');
                setTimeout(() => { window.location.href = '/caravans/index.html'; }, 2000);
                return;
            }

            try {
                const doc = await db.collection('caravans').doc(caravanId).get();
                
                if (!doc.exists) {
                    showMessage('❌ القافلة غير موجودة', 'error');
                    setTimeout(() => { window.location.href = '/caravans/index.html'; }, 2000);
                    return;
                }

                caravanData = { id: doc.id, ...doc.data() };
                renderCaravanPage();

            } catch (error) {
                console.log('Error loading caravan:', error);
                showMessage('❌ حدث خطأ في تحميل البيانات', 'error');
            }
        }

        // ============================================
        // عرض صفحة القافلة
        // ============================================
        function renderCaravanPage() {
            document.getElementById('loading').style.display = 'none';
            const container = document.getElementById('caravanContent');
            container.style.display = 'block';

            const status = getCaravanStatus(caravanData.startDate, caravanData.endDate);
            const statusClass = {
                active: 'status-active',
                upcoming: 'status-upcoming',
                ended: 'status-ended'
            }[status];
            const statusText = {
                active: 'نشطة حالياً',
                upcoming: 'قادمة',
                ended: 'منتهية'
            }[status];

            const defaultImage = 'https://via.placeholder.com/800x400/0e7c9e/ffffff?text=Caravan';

            // عرض الخدمات
            let servicesHtml = '';
            if (caravanData.type === 'discount' && caravanData.services?.length) {
                servicesHtml = `
                    <div class="services-section">
                        <div class="section-title"><i class="fas fa-percent"></i> الخدمات المخفضة</div>
                        <div class="services-grid">
                            ${caravanData.services.map(service => `
                                <div class="service-card">
                                    <div class="service-name">${service.name}</div>
                                    <div>
                                        <span class="service-discount">${service.discount}% خصم</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (caravanData.type === 'free' && caravanData.freeServices?.length) {
                servicesHtml = `
                    <div class="services-section">
                        <div class="section-title"><i class="fas fa-gift"></i> الخدمات المجانية</div>
                        <div>
                            ${caravanData.freeServices.map(service => `
                                <div class="free-service">
                                    <i class="fas fa-check-circle" style="color: var(--accent);"></i>
                                    <span>${service}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            container.innerHTML = `
                <div class="caravan-card">
                    <div class="caravan-header">
                        <div class="caravan-name">${caravanData.name || 'قافلة خيرية'}</div>
                        <div class="caravan-dates">
                            <span><i class="fas fa-calendar-alt"></i> بداية: ${caravanData.startDate || 'غير محدد'}</span>
                            <span><i class="fas fa-calendar-check"></i> نهاية: ${caravanData.endDate || 'غير محدد'}</span>
                        </div>
                        <div class="caravan-status ${statusClass}">${statusText}</div>
                    </div>
                    
                    <div class="caravan-image-section">
                        <img src="${caravanData.imageUrl || defaultImage}" class="caravan-image" onerror="this.src='${defaultImage}'">
                    </div>
                    
                    <div class="description-section">
                        <div class="section-title"><i class="fas fa-info-circle"></i> عن القافلة</div>
                        <div class="description-text">${caravanData.description || 'لا يوجد وصف متاح'}</div>
                    </div>
                    
                    ${servicesHtml}

                    <div class="back-section">
                        <a href="/caravans/index.html" class="back-btn"><i class="fas fa-arrow-right"></i> العودة إلى القوافل</a>
                    </div>
                </div>
            `;
        }

        // ============================================
        // عرض الرسائل
        // ============================================
        function showMessage(msg, type) {
            const msgDiv = document.getElementById('message');
            msgDiv.textContent = msg;
            msgDiv.className = `message ${type}`;
            msgDiv.style.display = 'block';
            setTimeout(() => { msgDiv.style.display = 'none'; }, 3000);
        }

        // ============================================
        // تشغيل
        // ============================================
        loadSiteData();
        loadCaravanData();
    </script>
</body>
</html>
