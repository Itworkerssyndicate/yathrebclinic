<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>تسجيل الدخول - مركز يثرب الخيري التخصصي</title>
    
    <!-- ===== الأمن السيبراني الشامل ===== -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self' https: data: blob:;
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com https://cdnjs.cloudflare.com https://fonts.googleapis.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com;
        font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:;
        img-src 'self' data: https: blob:;
        connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com;
    ">
    
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="format-detection" content="telephone=no">
    
    <!-- ===== Fonts & Icons ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- ===== Three.js للخلفية ===== -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- ===== Firebase SDK ===== -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #0e7c9e;
            --primary-dark: #0a5d7a;
            --primary-light: #2a9bc2;
            --secondary: #fbbf24;
            --secondary-dark: #f59e0b;
            --accent: #10b981;
            --danger: #ef4444;
            --light: #f8fafc;
            --dark: #0a1f2f;
            --darker: #051118;
            --gray: #94a3b8;
            --gradient-primary: linear-gradient(145deg, #0e7c9e, #0a5d7a);
            --gradient-secondary: linear-gradient(145deg, #fbbf24, #f59e0b);
            --shadow-sm: 0 4px 6px rgba(0,0,0,0.1);
            --shadow-md: 0 10px 30px rgba(0,0,0,0.3);
            --shadow-lg: 0 20px 50px rgba(0,0,0,0.5);
            --shadow-xl: 0 30px 70px rgba(0,0,0,0.7);
            --shadow-glow: 0 0 30px rgba(251,191,36,0.3);
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(145deg, var(--darker), var(--dark));
            color: var(--light);
            min-height: 100vh;
            overflow: hidden;
        }

        /* ===== حماية ===== */
        body {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* ===== خلفية 3D ===== */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(5,17,24,0.3) 0%, rgba(5,17,24,0.8) 100%);
            z-index: 1;
            pointer-events: none;
        }

        /* ===== الحاوية ===== */
        .login-container {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* ===== بطاقة تسجيل الدخول ===== */
        .login-card {
            background: rgba(5,17,24,0.85);
            backdrop-filter: blur(20px);
            border-radius: 60px;
            padding: 50px;
            width: 100%;
            max-width: 500px;
            border: 1px solid rgba(251,191,36,0.3);
            box-shadow: var(--shadow-xl), var(--shadow-glow);
            animation: fadeInUp 0.6s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== الشعار ===== */
        .logo-area {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--secondary);
            box-shadow: var(--shadow-glow);
            margin-bottom: 15px;
        }
        .logo-area h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
        }
        .logo-area p {
            color: var(--gray);
            font-size: 0.9rem;
            margin-top: 5px;
        }

        /* ===== النموذج ===== */
        .form-group {
            margin-bottom: 25px;
        }
        .form-label {
            display: block;
            margin-bottom: 8px;
            color: var(--gray);
            font-weight: 600;
            font-size: 0.9rem;
        }
        .form-label i {
            color: var(--secondary);
            margin-left: 5px;
        }
        .input-group {
            position: relative;
        }
        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--secondary);
            font-size: 1.1rem;
        }
        .form-control {
            width: 100%;
            padding: 15px 45px;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 30px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s;
            font-family: 'Cairo', sans-serif;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--secondary);
            background: rgba(255,255,255,0.1);
            box-shadow: 0 0 20px rgba(251,191,36,0.2);
        }
        .form-control::placeholder {
            color: rgba(255,255,255,0.3);
        }

        /* ===== خيارات ===== */
        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            font-size: 0.85rem;
        }
        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--gray);
            cursor: pointer;
        }
        .remember input {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: var(--secondary);
        }
        .forgot-link {
            color: var(--secondary);
            text-decoration: none;
            transition: all 0.3s;
        }
        .forgot-link:hover { text-decoration: underline; }

        /* ===== أزرار ===== */
        .login-btn {
            width: 100%;
            background: var(--gradient-primary);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 40px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: 1px solid var(--secondary);
            margin-bottom: 20px;
        }
        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-glow);
        }
        .login-btn:active {
            transform: translateY(0);
        }
        .login-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== رسائل الخطأ ===== */
        .error-message {
            background: rgba(239,68,68,0.2);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 12px 15px;
            border-radius: 30px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }
        .error-message.show { display: block; }

        /* ===== تحميل ===== */
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== روابط إضافية ===== */
        .extra-links {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .extra-links a {
            color: var(--gray);
            text-decoration: none;
            font-size: 0.85rem;
            margin: 0 10px;
            transition: all 0.3s;
        }
        .extra-links a:hover { color: var(--secondary); }

        @media (max-width: 600px) {
            .login-card { padding: 35px 25px; }
            .options { flex-direction: column; gap: 15px; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <!-- خلفية 3D -->
    <div id="canvas-container"></div>
    <div class="overlay"></div>

    <div class="login-container">
        <div class="login-card">
            <div class="logo-area">
                <img src="" alt="Logo" class="logo" id="siteLogo">
                <h1>مركز يثرب الخيري التخصصي</h1>
                <p>لوحة التحكم والإدارة</p>
            </div>

            <div class="error-message" id="errorMessage"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-envelope"></i> البريد الإلكتروني</label>
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="email" class="form-control" id="email" placeholder="admin@yathreb.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label"><i class="fas fa-lock"></i> كلمة المرور</label>
                    <div class="input-group">
                        <i class="fas fa-key"></i>
                        <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="options">
                    <label class="remember">
                        <input type="checkbox" id="remember"> تذكرني
                    </label>
                    <a href="#" class="forgot-link">نسيت كلمة المرور؟</a>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> تسجيل الدخول
                </button>
            </form>

            <div class="extra-links">
                <a href="/index.html"><i class="fas fa-home"></i> العودة للرئيسية</a>
                <a href="/clinic/index.html"><i class="fas fa-stethoscope"></i> العيادات</a>
                <a href="/lab/index.html"><i class="fas fa-flask"></i> المعمل</a>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // الأمن السيبراني الشامل
        // ============================================
        (function() {
            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('keydown', e => {
                if (e.ctrlKey && ['c','x','u','s','p','a','v'].includes(e.key.toLowerCase())) e.preventDefault();
                if (e.key === 'F12' || e.keyCode === 123) e.preventDefault();
                if (e.key === 'PrintScreen' || e.keyCode === 44) e.preventDefault();
            });
            document.addEventListener('selectstart', e => e.preventDefault());
            document.addEventListener('dragstart', e => e.preventDefault());
            document.addEventListener('copy', e => e.preventDefault());
            document.addEventListener('cut', e => e.preventDefault());
        })();

        // ============================================
        // تهيئة Firebase
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyDMXfjOsas18yb0b8mbbhGqJj78yFFTVyU",
            authDomain: "yathreb-10909.firebaseapp.com",
            projectId: "yathreb-10909"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ============================================
        // خلفية 3D
        // ============================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a1f2f);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        // جسيمات
        const particlesGeo = new THREE.BufferGeometry();
        const particlesCount = 1000;
        const posArray = new Float32Array(particlesCount * 3);
        for(let i = 0; i < particlesCount * 3; i += 3) {
            posArray[i] = (Math.random() - 0.5) * 40;
            posArray[i+1] = (Math.random() - 0.5) * 40;
            posArray[i+2] = (Math.random() - 0.5) * 40;
        }
        particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMat = new THREE.PointsMaterial({ color: 0x0e7c9e, size: 0.1, transparent: true, opacity: 0.4 });
        const particles = new THREE.Points(particlesGeo, particlesMat);
        scene.add(particles);

        camera.position.z = 20;

        function animate() {
            requestAnimationFrame(animate);
            particles.rotation.y += 0.0005;
            particles.rotation.x += 0.0003;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ============================================
        // تحميل إعدادات الموقع
        // ============================================
        async function loadSiteSettings() {
            try {
                const doc = await db.collection('settings').doc('comingSoon').get();
                if (doc.exists && doc.data().logoUrl) {
                    document.getElementById('siteLogo').src = doc.data().logoUrl;
                }
            } catch (error) {
                console.log('Error loading site settings:', error);
            }
        }
        loadSiteSettings();

        // ============================================
        // التحقق من وجود مستخدم مسجل
        // ============================================
        auth.onAuthStateChanged(user => {
            if (user) {
                window.location.href = 'index.html';
            }
        });

        // ============================================
        // تذكرني
        // ============================================
        const savedEmail = localStorage.getItem('rememberedEmail');
        if (savedEmail) {
            document.getElementById('email').value = savedEmail;
            document.getElementById('remember').checked = true;
        }

        // ============================================
        // تسجيل الدخول
        // ============================================
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const errorMessage = document.getElementById('errorMessage');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;

            if (!email || !password) {
                showError('❌ الرجاء إدخال البريد الإلكتروني وكلمة المرور');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner"></span> جاري تسجيل الدخول...';

            try {
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;

                // التحقق من صلاحيات المستخدم
                const userDoc = await db.collection('users').doc(user.uid).get();
                const userData = userDoc.data();

                if (!userData || (userData.role !== 'super_admin' && userData.role !== 'admin')) {
                    await auth.signOut();
                    showError('❌ غير مصرح لك بالدخول إلى لوحة التحكم');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> تسجيل الدخول';
                    return;
                }

                // حفظ البريد إذا تم اختيار تذكرني
                if (remember) {
                    localStorage.setItem('rememberedEmail', email);
                } else {
                    localStorage.removeItem('rememberedEmail');
                }

                // تسجيل نشاط الدخول
                await db.collection('activityLog').add({
                    userId: user.uid,
                    userEmail: email,
                    action: 'login',
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    ip: 'user'
                });

                window.location.href = 'index.html';

            } catch (error) {
                console.log('Login error:', error);
                let errorMsg = '❌ فشل تسجيل الدخول';
                if (error.code === 'auth/user-not-found') errorMsg = '❌ البريد الإلكتروني غير موجود';
                else if (error.code === 'auth/wrong-password') errorMsg = '❌ كلمة المرور غير صحيحة';
                else if (error.code === 'auth/invalid-email') errorMsg = '❌ البريد الإلكتروني غير صالح';
                else if (error.code === 'auth/too-many-requests') errorMsg = '❌ تم تعطيل الحساب مؤقتاً، حاول لاحقاً';
                showError(errorMsg);
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> تسجيل الدخول';
            }
        });

        function showError(msg) {
            errorMessage.textContent = msg;
            errorMessage.classList.add('show');
            setTimeout(() => {
                errorMessage.classList.remove('show');
            }, 5000);
        }

        // منع إرسال النموذج بالضغط على Enter مرتين
        let submitting = false;
        loginForm.addEventListener('submit', (e) => {
            if (submitting) {
                e.preventDefault();
                return;
            }
            submitting = true;
            setTimeout(() => { submitting = false; }, 2000);
        });
    </script>
</body>
</html>
