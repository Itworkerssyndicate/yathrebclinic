<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>جميع التحاليل - معمل يثرب للتحاليل الطبية</title>
    
    <!-- ===== الأمن السيبراني الشامل ===== -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self' https: data: blob:;
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com https://cdnjs.cloudflare.com https://fonts.googleapis.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com;
        font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:;
        img-src 'self' data: https: blob:;
        connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com;
    ">
    
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    
    <!-- ===== Fonts & Icons ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- ===== Firebase SDK ===== -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #0e7c9e;
            --primary-dark: #0a5d7a;
            --primary-light: #2a9bc2;
            --secondary: #fbbf24;
            --accent: #10b981;
            --danger: #ef4444;
            --light: #f8fafc;
            --dark: #0a1f2f;
            --darker: #051118;
            --gray: #94a3b8;
            --gradient-primary: linear-gradient(145deg, #0e7c9e, #0a5d7a);
            --gradient-secondary: linear-gradient(145deg, #fbbf24, #f59e0b);
            --shadow-md: 0 10px 30px rgba(0,0,0,0.3);
            --shadow-glow: 0 0 30px rgba(251,191,36,0.3);
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(145deg, var(--darker), var(--dark));
            color: var(--light);
            min-height: 100vh;
        }

        /* ===== حماية ===== */
        body {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        img { pointer-events: none; -webkit-user-drag: none; user-drag: none; }

        /* ===== الشريط العلوي ===== */
        .top-bar {
            background: rgba(5,17,24,0.8);
            backdrop-filter: blur(20px);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(251,191,36,0.2);
            flex-wrap: wrap;
            gap: 15px;
        }
        .logo-area { display: flex; align-items: center; gap: 15px; }
        .logo { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
        .site-title { font-size: 1.3rem; font-weight: 700; color: white; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { color: var(--gray); text-decoration: none; transition: all 0.3s; }
        .nav-links a:hover { color: var(--secondary); }

        /* ===== الهيدر ===== */
        .header {
            background: linear-gradient(145deg, var(--primary), var(--primary-dark));
            padding: 60px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
        }
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .header h1 { font-size: 2.5rem; color: white; position: relative; }
        .header p { color: rgba(255,255,255,0.8); margin-top: 10px; position: relative; }

        /* ===== الحاوية ===== */
        .container { max-width: 1400px; margin: 0 auto; padding: 40px 20px; }

        /* ===== شاشة التحميل ===== */
        .loading {
            text-align: center;
            padding: 100px 20px;
        }
        .loading i { font-size: 3rem; color: var(--secondary); animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== الفلاتر ===== */
        .filters-bar {
            background: rgba(5,17,24,0.5);
            backdrop-filter: blur(20px);
            border-radius: 60px;
            padding: 15px 25px;
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .filter-btn {
            background: transparent;
            border: 1px solid rgba(251,191,36,0.3);
            color: var(--gray);
            padding: 10px 25px;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Cairo', sans-serif;
        }
        .filter-btn:hover, .filter-btn.active {
            background: var(--gradient-primary);
            color: white;
            border-color: var(--secondary);
        }

        .search-bar {
            background: rgba(5,17,24,0.5);
            border-radius: 60px;
            padding: 10px 20px;
            margin-bottom: 40px;
            display: flex;
            gap: 10px;
            align-items: center;
            border: 1px solid rgba(251,191,36,0.2);
        }
        .search-bar i { color: var(--secondary); font-size: 1.2rem; }
        .search-bar input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            padding: 12px;
            font-size: 1rem;
            font-family: 'Cairo', sans-serif;
        }
        .search-bar input:focus { outline: none; }

        /* ===== شبكة التحاليل ===== */
        .tests-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
        }
        .test-card {
            background: rgba(5,17,24,0.6);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 25px;
            transition: all 0.4s;
            border: 1px solid rgba(251,191,36,0.1);
            cursor: pointer;
        }
        .test-card:hover {
            transform: translateY(-10px);
            border-color: var(--secondary);
            box-shadow: var(--shadow-glow);
        }
        .test-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }
        .test-name { font-size: 1.3rem; font-weight: 700; color: white; }
        .test-category {
            background: rgba(14,124,158,0.3);
            padding: 5px 12px;
            border-radius: 30px;
            font-size: 0.8rem;
            color: var(--primary-light);
        }
        .test-price {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 15px;
        }
        .test-price span { font-size: 1rem; color: var(--gray); }
        .test-details {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .test-detail {
            display: flex;
            align-items: center;
            gap: 5px;
            color: var(--gray);
            font-size: 0.85rem;
        }
        .test-detail i { color: var(--secondary); }
        .test-instructions {
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            padding: 12px;
            margin-top: 15px;
        }
        .test-instructions-title {
            color: var(--secondary);
            font-size: 0.85rem;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .test-instructions-text {
            color: var(--gray);
            font-size: 0.85rem;
            line-height: 1.5;
        }

        /* ===== مودال التفاصيل ===== */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(20px);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--dark);
            border-radius: 40px;
            padding: 40px;
            width: 90%;
            max-width: 550px;
            max-height: 85vh;
            overflow-y: auto;
            border: 2px solid var(--secondary);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .modal-header h3 { color: var(--secondary); font-size: 1.6rem; }
        .modal-close {
            background: none;
            border: none;
            color: var(--gray);
            font-size: 1.6rem;
            cursor: pointer;
        }
        .modal-close:hover { color: var(--danger); }
        .modal-section { margin-bottom: 20px; }
        .modal-section-title {
            color: var(--secondary);
            font-size: 1.1rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid rgba(251,191,36,0.2);
            padding-bottom: 5px;
        }

        /* ===== الفوتر ===== */
        .footer {
            background: rgba(5,17,24,0.8);
            padding: 40px 20px;
            text-align: center;
            margin-top: 60px;
            border-top: 1px solid rgba(251,191,36,0.1);
            color: var(--gray);
        }
        .footer a { color: var(--secondary); text-decoration: none; margin: 0 10px; }

        /* ===== رسائل ===== */
        .message {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 15px;
            color: white;
            z-index: 10001;
            animation: slideIn 0.3s ease;
            display: none;
        }
        .message.success { background: var(--gradient-primary); }
        .message.error { background: linear-gradient(145deg, #ef4444, #dc2626); }
        @keyframes slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @media (max-width: 768px) {
            .top-bar { flex-direction: column; text-align: center; }
            .header h1 { font-size: 1.8rem; }
            .tests-grid { grid-template-columns: 1fr; }
            .filter-btn { padding: 6px 15px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="logo-area">
            <img src="" alt="Logo" class="logo" id="siteLogo">
            <span class="site-title" id="siteTitle">مركز يثرب</span>
        </div>
        <div class="nav-links">
            <a href="/index.html">الرئيسية</a>
            <a href="/clinic/index.html">العيادات</a>
            <a href="/lab/index.html">المعمل</a>
            <a href="/admin/login.html">دخول الأدمن</a>
        </div>
    </div>

    <div class="header">
        <h1>جميع التحاليل الطبية</h1>
        <p>اختر التحليل المناسب وتعرف على التفاصيل والأسعار</p>
    </div>

    <div class="container">
        <div class="filters-bar" id="filtersBar"></div>
        
        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="ابحث عن تحليل...">
        </div>

        <div id="testsContainer">
            <div class="loading"><i class="fas fa-circle-notch"></i><br>جاري تحميل التحاليل...</div>
        </div>
    </div>

    <div class="modal" id="testModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle"></h3>
                <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <div class="footer">
        <a href="/index.html">الرئيسية</a>
        <a href="/clinic/index.html">العيادات</a>
        <a href="/lab/index.html">المعمل</a>
        <a href="/admin/login.html">دخول الأدمن</a>
        <p style="margin-top: 15px;">نقابة تكنولوجيا المعلومات والبرمجيات المصرية © 2026</p>
    </div>

    <div id="message" class="message"></div>

    <script>
        // ===== الأمن السيبراني =====
        (function() {
            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('keydown', e => {
                if (e.ctrlKey && ['c','x','u','s'].includes(e.key.toLowerCase())) e.preventDefault();
                if (e.key === 'F12') e.preventDefault();
            });
            document.addEventListener('selectstart', e => e.preventDefault());
        })();

        // ===== Firebase =====
        const firebaseConfig = { apiKey: "AIzaSyDMXfjOsas18yb0b8mbbhGqJj78yFFTVyU", authDomain: "yathreb-10909.firebaseapp.com", projectId: "yathreb-10909" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let allTests = [];
        let categories = new Set();

        async function loadSiteData() {
            const settings = await db.collection('settings').doc('comingSoon').get();
            if (settings.exists) {
                const data = settings.data();
                if (data.logoUrl) document.getElementById('siteLogo').src = data.logoUrl;
                if (data.centerName) document.getElementById('siteTitle').textContent = data.centerName;
            }
        }

        async function loadTests() {
            const snapshot = await db.collection('labTests').get();
            allTests = [];
            snapshot.forEach(doc => {
                const data = doc.data();
                if (data.isAvailable !== false) {
                    allTests.push({ id: doc.id, ...data });
                    if (data.category) categories.add(data.category);
                }
            });
            renderFilters();
            renderTests(allTests);
        }

        function renderFilters() {
            const container = document.getElementById('filtersBar');
            container.innerHTML = '<button class="filter-btn active" data-category="all">الكل</button>';
            Array.from(categories).sort().forEach(cat => {
                container.innerHTML += `<button class="filter-btn" data-category="${cat}">${cat}</button>`;
            });
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    filterTests();
                });
            });
        }

        function filterTests() {
            const category = document.querySelector('.filter-btn.active')?.dataset.category || 'all';
            const search = document.getElementById('searchInput').value.toLowerCase();
            let filtered = allTests;
            if (category !== 'all') filtered = filtered.filter(t => t.category === category);
            if (search) filtered = filtered.filter(t => t.name?.toLowerCase().includes(search));
            renderTests(filtered);
        }

        function renderTests(tests) {
            const container = document.getElementById('testsContainer');
            if (tests.length === 0) {
                container.innerHTML = '<div class="loading"><i class="fas fa-flask"></i><br>لا توجد تحاليل مطابقة</div>';
                return;
            }
            container.innerHTML = '';
            tests.forEach(test => {
                const price = test.offerPrice && test.offerPrice < test.price ? test.offerPrice : test.price;
                const card = document.createElement('div');
                card.className = 'test-card';
                card.onclick = () => openModal(test);
                card.innerHTML = `
                    <div class="test-header">
                        <span class="test-name">${test.name}</span>
                        <span class="test-category">${test.category}</span>
                    </div>
                    <div class="test-price">${price} <span>ج.م</span></div>
                    <div class="test-details">
                        <div class="test-detail"><i class="fas fa-clock"></i> ${test.duration || 'غير محدد'}</div>
                        <div class="test-detail"><i class="fas fa-chart-line"></i> ${test.resultsTime || '24 ساعة'}</div>
                    </div>
                    ${test.instructions?.length ? `
                        <div class="test-instructions">
                            <div class="test-instructions-title"><i class="fas fa-info-circle"></i> تعليمات</div>
                            <div class="test-instructions-text">${test.instructions[0]}${test.instructions.length > 1 ? '...' : ''}</div>
                        </div>
                    ` : ''}
                `;
                container.appendChild(card);
            });
        }

        function openModal(test) {
            const price = test.offerPrice && test.offerPrice < test.price ? test.offerPrice : test.price;
            document.getElementById('modalTitle').innerHTML = test.name;
            document.getElementById('modalBody').innerHTML = `
                <div class="modal-section"><div class="modal-section-title"><i class="fas fa-tag"></i> الفئة</div><p style="color:var(--light);">${test.category}</p></div>
                <div class="modal-section"><div class="modal-section-title"><i class="fas fa-dollar-sign"></i> السعر</div><p style="color:var(--accent); font-size:1.8rem; font-weight:700;">${price} ج.م</p></div>
                <div class="modal-section"><div class="modal-section-title"><i class="fas fa-clock"></i> المدة</div><p style="color:var(--light);">${test.duration || 'غير محدد'}</p></div>
                <div class="modal-section"><div class="modal-section-title"><i class="fas fa-chart-line"></i> النتيجة</div><p style="color:var(--light);">${test.resultsTime || '24 ساعة'}</p></div>
                ${test.preparation?.length ? `<div class="modal-section"><div class="modal-section-title"><i class="fas fa-clipboard-list"></i> التحضير</div><ul style="color:var(--gray);">${test.preparation.map(p => `<li>${p}</li>`).join('')}</ul></div>` : ''}
                ${test.instructions?.length ? `<div class="modal-section"><div class="modal-section-title"><i class="fas fa-info-circle"></i> التعليمات</div><ul style="color:var(--gray);">${test.instructions.map(i => `<li>${i}</li>`).join('')}</ul></div>` : ''}
            `;
            document.getElementById('testModal').classList.add('active');
        }

        function closeModal() { document.getElementById('testModal').classList.remove('active'); }

        document.getElementById('searchInput').addEventListener('keyup', filterTests);

        loadSiteData();
        loadTests();
    </script>
</body>
</html>
