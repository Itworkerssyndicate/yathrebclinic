<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>تفاصيل الدكتور - مركز يثرب الخيري التخصصي</title>
    
    <!-- ===== الأمن السيبراني الشامل ===== -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self' https: data: blob:;
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com https://cdnjs.cloudflare.com https://fonts.googleapis.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com;
        font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:;
        img-src 'self' data: https: blob:;
        connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com;
    ">
    
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="format-detection" content="telephone=no">
    
    <!-- ===== Fonts & Icons ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- ===== Firebase SDK ===== -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #0e7c9e;
            --primary-dark: #0a5d7a;
            --primary-light: #2a9bc2;
            --secondary: #fbbf24;
            --secondary-dark: #f59e0b;
            --accent: #10b981;
            --danger: #ef4444;
            --light: #f8fafc;
            --dark: #0a1f2f;
            --darker: #051118;
            --gray: #94a3b8;
            --gradient-primary: linear-gradient(145deg, #0e7c9e, #0a5d7a);
            --gradient-secondary: linear-gradient(145deg, #fbbf24, #f59e0b);
            --shadow-sm: 0 4px 6px rgba(0,0,0,0.1);
            --shadow-md: 0 10px 30px rgba(0,0,0,0.3);
            --shadow-lg: 0 20px 50px rgba(0,0,0,0.5);
            --shadow-xl: 0 30px 70px rgba(0,0,0,0.7);
            --shadow-glow: 0 0 30px rgba(251,191,36,0.3);
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(145deg, var(--darker), var(--dark));
            color: var(--light);
            min-height: 100vh;
        }

        /* ===== حماية ===== */
        body {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        img { pointer-events: none; -webkit-user-drag: none; user-drag: none; }

        /* ===== الشريط العلوي ===== */
        .top-bar {
            background: rgba(5,17,24,0.8);
            backdrop-filter: blur(20px);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(251,191,36,0.2);
            flex-wrap: wrap;
            gap: 15px;
        }
        .logo-area { display: flex; align-items: center; gap: 15px; }
        .logo { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
        .site-title { font-size: 1.3rem; font-weight: 700; color: white; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { color: var(--gray); text-decoration: none; transition: all 0.3s; }
        .nav-links a:hover { color: var(--secondary); }

        /* ===== محتوى الصفحة ===== */
        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }

        /* ===== شاشة التحميل ===== */
        .loading {
            text-align: center;
            padding: 100px 20px;
        }
        .loading i { font-size: 3rem; color: var(--secondary); animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== بطاقة الدكتور ===== */
        .doctor-card {
            background: rgba(5,17,24,0.6);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            overflow: hidden;
            border: 1px solid rgba(251,191,36,0.1);
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .doctor-header {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 40px;
            padding: 40px;
            border-bottom: 1px solid rgba(251,191,36,0.1);
        }
        .doctor-image-area { text-align: center; }
        .doctor-image {
            width: 100%;
            max-width: 300px;
            border-radius: 30px;
            box-shadow: var(--shadow-lg);
            border: 3px solid var(--secondary);
        }
        .doctor-status {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 40px;
            margin-top: 15px;
            font-weight: 600;
        }
        .status-available { background: rgba(16,185,129,0.2); color: var(--accent); border: 1px solid var(--accent); }
        .status-busy { background: rgba(239,68,68,0.2); color: var(--danger); border: 1px solid var(--danger); }
        .status-off { background: rgba(148,163,184,0.2); color: var(--gray); border: 1px solid var(--gray); }

        .doctor-info h1 { font-size: 2.5rem; font-weight: 900; color: white; margin-bottom: 10px; }
        .doctor-specialty { color: var(--secondary); font-size: 1.2rem; margin-bottom: 20px; }
        .doctor-bio { color: var(--gray); line-height: 1.8; margin-bottom: 20px; }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .info-item {
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            padding: 15px;
            text-align: center;
        }
        .info-item i { font-size: 2rem; color: var(--secondary); margin-bottom: 10px; display: block; }
        .info-label { color: var(--gray); font-size: 0.9rem; margin-bottom: 5px; }
        .info-value { color: white; font-size: 1.2rem; font-weight: 600; }

        .qualifications-list, .languages-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }
        .qualification-tag, .language-tag {
            background: rgba(14,124,158,0.2);
            border: 1px solid var(--primary);
            padding: 8px 15px;
            border-radius: 30px;
            font-size: 0.9rem;
            color: var(--light);
        }

        /* ===== جدول المواعيد ===== */
        .schedule-section {
            padding: 40px;
            border-bottom: 1px solid rgba(251,191,36,0.1);
        }
        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--secondary);
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .schedule-table {
            width: 100%;
            border-collapse: collapse;
        }
        .schedule-table th {
            text-align: right;
            padding: 15px;
            background: rgba(14,124,158,0.2);
            color: white;
            font-weight: 600;
            border-radius: 15px 15px 0 0;
        }
        .schedule-table td {
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .day-off { color: var(--danger); }
        .time-slot { color: var(--accent); }

        /* ===== أسعار الكشوفات ===== */
        .prices-section {
            padding: 40px;
            border-bottom: 1px solid rgba(251,191,36,0.1);
        }
        .prices-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }
        .price-card {
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s;
        }
        .price-card:hover { transform: translateY(-5px); border: 1px solid var(--secondary); }
        .price-type { color: var(--gray); font-size: 0.9rem; margin-bottom: 5px; }
        .price-amount { font-size: 2rem; font-weight: 700; color: var(--accent); }
        .price-amount span { font-size: 1rem; }

        /* ===== زر الحجز ===== */
        .booking-section {
            padding: 40px;
            text-align: center;
        }
        .book-btn {
            background: var(--gradient-primary);
            color: white;
            border: none;
            padding: 18px 50px;
            border-radius: 60px;
            font-size: 1.3rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid var(--secondary);
            display: inline-flex;
            align-items: center;
            gap: 15px;
        }
        .book-btn:hover { transform: translateY(-3px); box-shadow: var(--shadow-glow); }

        /* ===== مودال الحجز ===== */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(20px);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--dark);
            border-radius: 40px;
            padding: 40px;
            width: 90%;
            max-width: 500px;
            border: 2px solid var(--secondary);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .modal-header h3 { color: var(--secondary); font-size: 1.5rem; }
        .modal-close {
            background: none;
            border: none;
            color: var(--gray);
            font-size: 1.5rem;
            cursor: pointer;
        }
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; margin-bottom: 8px; color: var(--gray); font-weight: 600; }
        .form-control {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            color: white;
            font-size: 1rem;
        }
        .form-control:focus { outline: none; border-color: var(--secondary); }
        .submit-btn {
            background: var(--gradient-primary);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 40px;
            width: 100%;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 10px;
        }

        /* ===== الفوتر ===== */
        .footer {
            background: rgba(5,17,24,0.8);
            padding: 40px 20px;
            text-align: center;
            margin-top: 60px;
            border-top: 1px solid rgba(251,191,36,0.1);
            color: var(--gray);
        }
        .footer a { color: var(--secondary); text-decoration: none; margin: 0 10px; }

        /* ===== رسائل ===== */
        .message {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 15px;
            color: white;
            z-index: 10001;
            animation: slideIn 0.3s ease;
            display: none;
        }
        .message.success { background: var(--gradient-primary); }
        .message.error { background: linear-gradient(145deg, #ef4444, #dc2626); }
        @keyframes slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* ===== استجابة ===== */
        @media (max-width: 1024px) {
            .doctor-header {
                grid-template-columns: 1fr;
                text-align: center;
            }
            .doctor-image { margin: 0 auto; }
        }
        @media (max-width: 768px) {
            .top-bar { flex-direction: column; text-align: center; }
            .doctor-info h1 { font-size: 2rem; }
            .info-grid { grid-template-columns: 1fr; }
            .schedule-table th, .schedule-table td { padding: 8px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <!-- الشريط العلوي -->
    <div class="top-bar">
        <div class="logo-area">
            <img src="" alt="Logo" class="logo" id="siteLogo">
            <span class="site-title" id="siteTitle">مركز يثرب</span>
        </div>
        <div class="nav-links">
            <a href="/index.html">الرئيسية</a>
            <a href="/clinic/index.html">العيادات</a>
            <a href="/lab/index.html">المعمل</a>
            <a href="/admin/login.html">دخول الأدمن</a>
        </div>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="container" id="container">
        <div class="loading" id="loading">
            <i class="fas fa-circle-notch"></i>
            <p>جاري تحميل بيانات الدكتور...</p>
        </div>
        <div id="doctorContent" style="display: none;"></div>
    </div>

    <!-- مودال الحجز -->
    <div class="modal" id="bookingModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">حجز موعد</h3>
                <button class="modal-close" onclick="closeBookingModal()"><i class="fas fa-times"></i></button>
            </div>
            <form id="bookingForm">
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-user"></i> الاسم الكامل</label>
                    <input type="text" class="form-control" id="patientName" required>
                </div>
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-phone"></i> رقم الهاتف</label>
                    <input type="tel" class="form-control" id="patientPhone" required>
                </div>
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-calendar"></i> التاريخ</label>
                    <input type="date" class="form-control" id="appointmentDate" required>
                </div>
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-clock"></i> الوقت</label>
                    <input type="time" class="form-control" id="appointmentTime" required>
                </div>
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-tag"></i> نوع الموعد</label>
                    <select class="form-control" id="appointmentType">
                        <option value="consultation">كشف</option>
                        <option value="followup">متابعة</option>
                        <option value="emergency">طوارئ</option>
                    </select>
                </div>
                <button type="button" class="submit-btn" onclick="submitBooking()">تأكيد الحجز</button>
            </form>
        </div>
    </div>

    <div id="message" class="message"></div>

    <div class="footer">
        <a href="/index.html">الرئيسية</a>
        <a href="/clinic/index.html">العيادات</a>
        <a href="/lab/index.html">المعمل</a>
        <a href="/admin/login.html">دخول الأدمن</a>
        <p style="margin-top: 15px;">نقابة تكنولوجيا المعلومات والبرمجيات المصرية © 2026</p>
    </div>

    <script>
        // ============================================
        // الأمن السيبراني الشامل
        // ============================================
        (function() {
            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('keydown', e => {
                if (e.ctrlKey && ['c','x','u','s','p','a','v'].includes(e.key.toLowerCase())) e.preventDefault();
                if (e.key === 'F12' || e.keyCode === 123) e.preventDefault();
                if (e.key === 'PrintScreen' || e.keyCode === 44) e.preventDefault();
            });
            document.addEventListener('selectstart', e => e.preventDefault());
            document.addEventListener('dragstart', e => e.preventDefault());
            document.addEventListener('copy', e => e.preventDefault());
            document.addEventListener('cut', e => e.preventDefault());
        })();

        // ============================================
        // تهيئة Firebase
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyDMXfjOsas18yb0b8mbbhGqJj78yFFTVyU",
            authDomain: "yathreb-10909.firebaseapp.com",
            projectId: "yathreb-10909"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ============================================
        // متغيرات عامة
        // ============================================
        let doctorId = null;
        let doctorData = null;

        // ============================================
        // الحصول على ID الدكتور من الرابط
        // ============================================
        function getDoctorIdFromUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id');
        }

        // ============================================
        // تحميل بيانات الموقع العامة
        // ============================================
        async function loadSiteData() {
            try {
                const settings = await db.collection('settings').doc('comingSoon').get();
                if (settings.exists) {
                    const data = settings.data();
                    if (data.logoUrl) {
                        document.getElementById('siteLogo').src = data.logoUrl;
                    }
                    if (data.centerName) {
                        document.getElementById('siteTitle').textContent = data.centerName;
                    }
                }
            } catch (error) {
                console.log('Error loading site data:', error);
            }
        }

        // ============================================
        // تحميل بيانات الدكتور
        // ============================================
        async function loadDoctorData() {
            doctorId = getDoctorIdFromUrl();
            
            if (!doctorId) {
                showMessage('❌ لم يتم تحديد الدكتور', 'error');
                setTimeout(() => {
                    window.location.href = '/clinic/index.html';
                }, 2000);
                return;
            }

            try {
                const doc = await db.collection('doctors').doc(doctorId).get();
                
                if (!doc.exists) {
                    showMessage('❌ الدكتور غير موجود', 'error');
                    setTimeout(() => {
                        window.location.href = '/clinic/index.html';
                    }, 2000);
                    return;
                }

                doctorData = { id: doc.id, ...doc.data() };
                renderDoctorPage();

            } catch (error) {
                console.log('Error loading doctor:', error);
                showMessage('❌ حدث خطأ في تحميل البيانات', 'error');
            }
        }

        // ============================================
        // عرض صفحة الدكتور
        // ============================================
        function renderDoctorPage() {
            document.getElementById('loading').style.display = 'none';
            const container = document.getElementById('doctorContent');
            container.style.display = 'block';

            // تحديد الحالة
            let statusClass = 'status-off';
            let statusText = 'غير متاح';
            if (doctorData.isAvailable === true) {
                statusClass = 'status-available';
                statusText = 'متاح الآن';
            } else if (doctorData.isAvailable === false) {
                statusClass = 'status-busy';
                statusText = 'غير متاح حالياً';
            }

            // عرض الجدول
            let scheduleHtml = '';
            if (doctorData.schedule && doctorData.schedule.length) {
                scheduleHtml = `
                    <div class="schedule-section">
                        <div class="section-title"><i class="fas fa-calendar-week"></i> مواعيد العمل</div>
                        <table class="schedule-table">
                            <thead>
                                <tr><th>اليوم</th><th>الفترة الصباحية</th><th>الفترة المسائية</th> </tr>
                            </thead>
                            <tbody>
                `;
                const daysOrder = ['السبت', 'الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة'];
                daysOrder.forEach(day => {
                    const schedule = doctorData.schedule.find(s => s.day === day);
                    if (schedule) {
                        const morning = schedule.morningStart && schedule.morningEnd ? `${schedule.morningStart} - ${schedule.morningEnd}` : 'لا يوجد';
                        const evening = schedule.eveningStart && schedule.eveningEnd ? `${schedule.eveningStart} - ${schedule.eveningEnd}` : 'لا يوجد';
                        scheduleHtml += `<tr><td>${day}</td><td class="${morning === 'لا يوجد' ? 'day-off' : 'time-slot'}">${morning}</td><td class="${evening === 'لا يوجد' ? 'day-off' : 'time-slot'}">${evening}</td></tr>`;
                    } else {
                        scheduleHtml += `<tr><td>${day}</td><td class="day-off">مغلق</td><td class="day-off">مغلق</td></tr>`;
                    }
                });
                scheduleHtml += `</tbody></table></div>`;
            } else {
                scheduleHtml = `
                    <div class="schedule-section">
                        <div class="section-title"><i class="fas fa-calendar-week"></i> مواعيد العمل</div>
                        <p style="color: var(--gray); text-align: center;">لم يتم تحديد مواعيد العمل بعد</p>
                    </div>
                `;
            }

            // عرض الأسعار
            const prices = doctorData.prices || { consultation: 0, followUp: 0, emergency: 0 };
            const pricesHtml = `
                <div class="prices-section">
                    <div class="section-title"><i class="fas fa-dollar-sign"></i> أسعار الكشوفات</div>
                    <div class="prices-grid">
                        <div class="price-card"><div class="price-type">كشف عادي</div><div class="price-amount">${prices.consultation || 0}<span> ج.م</span></div></div>
                        <div class="price-card"><div class="price-type">متابعة</div><div class="price-amount">${prices.followUp || 0}<span> ج.م</span></div></div>
                        <div class="price-card"><div class="price-type">طوارئ</div><div class="price-amount">${prices.emergency || 0}<span> ج.م</span></div></div>
                    </div>
                </div>
            `;

            // عرض زر الحجز
            const bookingHtml = `
                <div class="booking-section">
                    <button class="book-btn" onclick="openBookingModal()"><i class="fas fa-calendar-check"></i> احجز موعد الآن</button>
                </div>
            `;

            // تجميع الصفحة
            container.innerHTML = `
                <div class="doctor-card">
                    <div class="doctor-header">
                        <div class="doctor-image-area">
                            <img src="${doctorData.imageUrl || 'https://via.placeholder.com/300x300/0e7c9e/ffffff?text=Doctor'}" class="doctor-image" onerror="this.src='https://via.placeholder.com/300x300/0e7c9e/ffffff?text=Doctor'">
                            <div class="doctor-status ${statusClass}">${statusText}</div>
                        </div>
                        <div class="doctor-info">
                            <h1>${doctorData.name || 'طبيب'}</h1>
                            <div class="doctor-specialty">${doctorData.specialty || 'تخصص عام'}</div>
                            <div class="doctor-bio">${doctorData.bio || 'لا توجد سيرة ذاتية متاحة حالياً'}</div>
                            <div class="info-grid">
                                <div class="info-item"><i class="fas fa-graduation-cap"></i><div class="info-label">الخبرة</div><div class="info-value">${doctorData.experience || 0} سنة</div></div>
                                <div class="info-item"><i class="fas fa-clock"></i><div class="info-label">نوع الحجز</div><div class="info-value">${doctorData.bookingType === 'online' ? 'أونلاين' : doctorData.bookingType === 'walkin' ? 'حضور مباشر' : 'كلاهما'}</div></div>
                            </div>
                            <div><div class="info-label"><i class="fas fa-certificate"></i> المؤهلات</div><div class="qualifications-list">${(doctorData.qualifications || []).map(q => `<span class="qualification-tag">${q}</span>`).join('') || '<span class="qualification-tag">غير محدد</span>'}</div></div>
                            <div style="margin-top: 15px;"><div class="info-label"><i class="fas fa-language"></i> اللغات</div><div class="languages-list">${(doctorData.languages || []).map(l => `<span class="language-tag">${l}</span>`).join('') || '<span class="language-tag">غير محدد</span>'}</div></div>
                        </div>
                    </div>
                    ${scheduleHtml}
                    ${pricesHtml}
                    ${bookingHtml}
                </div>
            `;
        }

        // ============================================
        // فتح مودال الحجز
        // ============================================
        function openBookingModal() {
            if (!doctorData.isAvailable) {
                showMessage('❌ هذا الدكتور غير متاح حالياً', 'error');
                return;
            }
            document.getElementById('modalTitle').textContent = `حجز موعد مع ${doctorData.name}`;
            document.getElementById('bookingModal').classList.add('active');
        }

        function closeBookingModal() {
            document.getElementById('bookingModal').classList.remove('active');
            document.getElementById('bookingForm').reset();
        }

        // ============================================
        // تأكيد الحجز
        // ============================================
        async function submitBooking() {
            const patientName = document.getElementById('patientName').value;
            const patientPhone = document.getElementById('patientPhone').value;
            const date = document.getElementById('appointmentDate').value;
            const time = document.getElementById('appointmentTime').value;
            const type = document.getElementById('appointmentType').value;

            if (!patientName || !patientPhone || !date || !time) {
                showMessage('❌ الرجاء ملء جميع الحقول', 'error');
                return;
            }

            try {
                await db.collection('appointments').add({
                    patientName,
                    patientPhone,
                    doctorId: doctorId,
                    doctorName: doctorData.name,
                    date,
                    time,
                    type,
                    status: 'pending',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                showMessage('✅ تم حجز الموعد بنجاح! سيتم التواصل معك قريباً', 'success');
                closeBookingModal();

            } catch (error) {
                console.log('Error booking:', error);
                showMessage('❌ حدث خطأ في حجز الموعد', 'error');
            }
        }

        // ============================================
        // عرض الرسائل
        // ============================================
        function showMessage(msg, type) {
            const msgDiv = document.getElementById('message');
            msgDiv.textContent = msg;
            msgDiv.className = `message ${type}`;
            msgDiv.style.display = 'block';
            setTimeout(() => {
                msgDiv.style.display = 'none';
            }, 3000);
        }

        // ============================================
        // تشغيل
        // ============================================
        loadSiteData();
        loadDoctorData();
    </script>
</body>
</html>
