<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>عيادات يثرب التخصصية</title>
    
    <!-- ===== الأمن السيبراني ===== -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self' https: data: blob:;
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com https://cdnjs.cloudflare.com https://fonts.googleapis.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com;
        font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:;
        img-src 'self' data: https: blob:;
        connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com;
    ">
    
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    
    <!-- ===== Fonts & Icons ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- ===== Firebase SDK ===== -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #0e7c9e;
            --primary-dark: #0a5d7a;
            --secondary: #fbbf24;
            --accent: #10b981;
            --light: #f8fafc;
            --dark: #0a1f2f;
            --darker: #051118;
            --gray: #94a3b8;
            --gradient-primary: linear-gradient(145deg, #0e7c9e, #0a5d7a);
            --gradient-secondary: linear-gradient(145deg, #fbbf24, #f59e0b);
            --shadow-sm: 0 4px 6px rgba(0,0,0,0.1);
            --shadow-md: 0 10px 30px rgba(0,0,0,0.3);
            --shadow-lg: 0 20px 50px rgba(0,0,0,0.5);
            --shadow-glow: 0 0 30px rgba(251,191,36,0.3);
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(145deg, var(--darker), var(--dark));
            color: var(--light);
            min-height: 100vh;
        }

        /* ===== الشريط العلوي ===== */
        .top-bar {
            background: rgba(5,17,24,0.8);
            backdrop-filter: blur(20px);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(251,191,36,0.2);
            flex-wrap: wrap;
            gap: 15px;
        }
        .logo-area { display: flex; align-items: center; gap: 15px; }
        .logo { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
        .site-title { font-size: 1.3rem; font-weight: 700; color: white; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { color: var(--gray); text-decoration: none; transition: all 0.3s; }
        .nav-links a:hover { color: var(--secondary); }

        /* ===== الهيدر ===== */
        .header {
            background: linear-gradient(145deg, var(--primary), var(--primary-dark));
            padding: 80px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
        }
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .header h1 { font-size: 3rem; color: white; position: relative; }
        .header p { color: rgba(255,255,255,0.8); margin-top: 10px; position: relative; font-size: 1.1rem; }

        /* ===== الحاوية ===== */
        .container { max-width: 1400px; margin: 0 auto; padding: 40px 20px; }

        /* ===== الفلاتر ===== */
        .filters-bar {
            background: rgba(5,17,24,0.7);
            backdrop-filter: blur(20px);
            border-radius: 60px;
            padding: 15px 25px;
            margin-bottom: 40px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .filter-btn {
            background: transparent;
            border: 1px solid rgba(251,191,36,0.3);
            color: var(--gray);
            padding: 10px 25px;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Cairo', sans-serif;
        }
        .filter-btn:hover, .filter-btn.active {
            background: var(--gradient-primary);
            color: white;
            border-color: var(--secondary);
            box-shadow: var(--shadow-sm);
        }

        /* ===== شبكة الأطباء ===== */
        .doctors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
        }
        .doctor-card {
            background: rgba(5,17,24,0.6);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(251,191,36,0.1);
            cursor: pointer;
        }
        .doctor-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: var(--secondary);
            box-shadow: var(--shadow-glow);
        }
        .doctor-image {
            width: 100%;
            height: 280px;
            object-fit: cover;
        }
        .doctor-info { padding: 25px; text-align: center; }
        .doctor-name { font-size: 1.6rem; font-weight: 700; color: white; margin-bottom: 5px; }
        .doctor-specialty { color: var(--secondary); margin-bottom: 15px; font-size: 1.1rem; }
        .doctor-qualifications { color: var(--gray); font-size: 0.9rem; margin-bottom: 15px; }
        .doctor-price { color: var(--gray); margin-bottom: 15px; }
        .doctor-price span { color: var(--accent); font-size: 1.4rem; font-weight: 700; }
        .doctor-status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 30px;
            font-size: 0.85rem;
            margin-bottom: 15px;
        }
        .status-available { background: rgba(16,185,129,0.2); color: var(--accent); }
        .status-busy { background: rgba(239,68,68,0.2); color: #ef4444; }
        .book-btn {
            background: var(--gradient-primary);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 40px;
            width: 100%;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
        }
        .book-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-glow); }

        /* ===== تحميل ===== */
        .loading {
            text-align: center;
            padding: 60px;
            color: var(--gray);
        }
        .loading i { font-size: 3rem; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== الفوتر ===== */
        .footer {
            background: rgba(5,17,24,0.8);
            padding: 40px 20px;
            text-align: center;
            margin-top: 60px;
            border-top: 1px solid rgba(251,191,36,0.1);
            color: var(--gray);
        }
        .footer a { color: var(--secondary); text-decoration: none; margin: 0 10px; transition: all 0.3s; }
        .footer a:hover { text-decoration: underline; }

        /* ===== مودال الحجز ===== */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(20px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--dark);
            border-radius: 40px;
            padding: 40px;
            width: 90%;
            max-width: 500px;
            border: 2px solid var(--secondary);
            text-align: center;
        }
        .modal-content h3 { color: var(--secondary); margin-bottom: 20px; }
        .modal-content input, .modal-content select {
            width: 100%;
            padding: 12px 15px;
            margin: 10px 0;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(251,191,36,0.3);
            border-radius: 30px;
            color: white;
            font-family: 'Cairo', sans-serif;
        }
        .modal-content button {
            background: var(--gradient-primary);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 40px;
            margin-top: 20px;
            cursor: pointer;
        }
        .close-modal {
            background: none;
            border: none;
            color: var(--gray);
            font-size: 1.5rem;
            position: absolute;
            top: 20px;
            left: 20px;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .top-bar { flex-direction: column; text-align: center; }
            .header h1 { font-size: 2rem; }
            .doctors-grid { grid-template-columns: 1fr; }
            .filters-bar { border-radius: 30px; }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="logo-area">
            <img src="" alt="Logo" class="logo" id="siteLogo">
            <span class="site-title" id="siteTitle">مركز يثرب</span>
        </div>
        <div class="nav-links">
            <a href="/index.html">الرئيسية</a>
            <a href="/lab/index.html">المعمل</a>
            <a href="/admin/login.html">دخول الأدمن</a>
        </div>
    </div>

    <div class="header">
        <h1>عيادات يثرب التخصصية</h1>
        <p>نخبة من الأطباء الاستشاريين في جميع التخصصات</p>
    </div>

    <div class="container">
        <div class="filters-bar" id="filtersBar"></div>
        <div class="doctors-grid" id="doctorsGrid">
            <div class="loading"><i class="fas fa-circle-notch"></i><br>جاري التحميل...</div>
        </div>
    </div>

    <div class="footer">
        <a href="/index.html">الرئيسية</a>
        <a href="/lab/index.html">المعمل</a>
        <a href="/admin/login.html">دخول الأدمن</a>
        <p style="margin-top: 15px;">نقابة تكنولوجيا المعلومات والبرمجيات المصرية © 2026</p>
    </div>

    <!-- مودال الحجز -->
    <div class="modal" id="bookingModal">
        <button class="close-modal" onclick="closeModal()"><i class="fas fa-times"></i></button>
        <div class="modal-content">
            <h3 id="modalDoctorName"></h3>
            <input type="text" id="patientName" placeholder="الاسم الكامل" required>
            <input type="tel" id="patientPhone" placeholder="رقم الهاتف" required>
            <input type="date" id="appointmentDate" required>
            <input type="time" id="appointmentTime" required>
            <select id="appointmentType">
                <option value="consultation">كشف</option>
                <option value="followup">متابعة</option>
                <option value="emergency">طوارئ</option>
            </select>
            <button onclick="submitBooking()">تأكيد الحجز</button>
        </div>
    </div>

    <script>
        // ===== الأمن السيبراني =====
        (function() {
            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('keydown', e => { if (e.ctrlKey && ['c','x','u','s'].includes(e.key.toLowerCase())) e.preventDefault(); if (e.key === 'F12') e.preventDefault(); });
            document.addEventListener('selectstart', e => e.preventDefault());
        })();

        // ===== Firebase =====
        const firebaseConfig = { apiKey: "AIzaSyDMXfjOsas18yb0b8mbbhGqJj78yFFTVyU", authDomain: "yathreb-10909.firebaseapp.com", projectId: "yathreb-10909" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ===== متغيرات =====
        let allDoctors = [];
        let specialties = new Set();
        let selectedDoctorId = null;

        // ===== تحميل البيانات =====
        async function loadSiteData() {
            const settings = await db.collection('settings').doc('comingSoon').get();
            if (settings.exists) {
                const data = settings.data();
                if (data.logoUrl) document.getElementById('siteLogo').src = data.logoUrl;
                if (data.centerName) document.getElementById('siteTitle').textContent = data.centerName;
            }
        }

        async function loadDoctors() {
            const snapshot = await db.collection('doctors').get();
            allDoctors = [];
            snapshot.forEach(doc => {
                const data = doc.data();
                allDoctors.push({ id: doc.id, ...data });
                if (data.specialty) specialties.add(data.specialty);
            });
            renderFilters();
            renderDoctors(allDoctors);
        }

        function renderFilters() {
            const container = document.getElementById('filtersBar');
            container.innerHTML = '<button class="filter-btn active" data-specialty="all">جميع التخصصات</button>';
            specialties.forEach(specialty => {
                container.innerHTML += `<button class="filter-btn" data-specialty="${specialty}">${specialty}</button>`;
            });
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    const specialty = btn.dataset.specialty;
                    if (specialty === 'all') renderDoctors(allDoctors);
                    else renderDoctors(allDoctors.filter(d => d.specialty === specialty));
                });
            });
        }

        function renderDoctors(doctors) {
            const container = document.getElementById('doctorsGrid');
            if (doctors.length === 0) {
                container.innerHTML = '<p style="text-align:center; padding:60px;">لا يوجد أطباء حالياً</p>';
                return;
            }
            container.innerHTML = '';
            doctors.forEach(doctor => {
                const card = document.createElement('div');
                card.className = 'doctor-card';
                card.innerHTML = `
                    <img src="${doctor.imageUrl || 'https://via.placeholder.com/400x280/0e7c9e/ffffff?text=Doctor'}" class="doctor-image" onerror="this.src='https://via.placeholder.com/400x280/0e7c9e/ffffff?text=Doctor'">
                    <div class="doctor-info">
                        <h3 class="doctor-name">${doctor.name || 'طبيب'}</h3>
                        <div class="doctor-specialty">${doctor.specialty || 'تخصص عام'}</div>
                        <div class="doctor-qualifications">${(doctor.qualifications || []).slice(0,2).join(' • ') || 'استشاري'}</div>
                        <div class="doctor-price">سعر الكشف: <span>${doctor.prices?.consultation || 0} ج.م</span></div>
                        <div class="doctor-status ${doctor.isAvailable ? 'status-available' : 'status-busy'}">${doctor.isAvailable ? 'متاح الآن' : 'غير متاح حالياً'}</div>
                        <button class="book-btn" onclick="openBookingModal('${doctor.id}', '${doctor.name}')"><i class="fas fa-calendar-check"></i> احجز موعد</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openBookingModal(doctorId, doctorName) {
            selectedDoctorId = doctorId;
            document.getElementById('modalDoctorName').textContent = `حجز موعد مع ${doctorName}`;
            document.getElementById('bookingModal').classList.add('active');
        }

        async function submitBooking() {
            const patientName = document.getElementById('patientName').value;
            const patientPhone = document.getElementById('patientPhone').value;
            const date = document.getElementById('appointmentDate').value;
            const time = document.getElementById('appointmentTime').value;
            const type = document.getElementById('appointmentType').value;

            if (!patientName || !patientPhone || !date || !time) {
                alert('❌ الرجاء ملء جميع الحقول');
                return;
            }

            try {
                await db.collection('appointments').add({
                    patientName,
                    patientPhone,
                    doctorId: selectedDoctorId,
                    date,
                    time,
                    type,
                    status: 'pending',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert('✅ تم حجز الموعد بنجاح! سيتم التواصل معك قريباً');
                closeModal();
                document.getElementById('patientName').value = '';
                document.getElementById('patientPhone').value = '';
                document.getElementById('appointmentDate').value = '';
                document.getElementById('appointmentTime').value = '';
            } catch (error) {
                alert('❌ حدث خطأ في الحجز');
            }
        }

        function closeModal() {
            document.getElementById('bookingModal').classList.remove('active');
        }

        // ===== تشغيل =====
        loadSiteData();
        loadDoctors();
    </script>
</body>
</html>
